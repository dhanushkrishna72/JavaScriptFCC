<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom manupilations</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .buttons {
            background: #4085ed;
            color: aliceblue;
            border: 2px solid #4085ed;
            padding: 1rem 3rem;
            border-radius: 2rem;
            margin: 1rem 0;
            width: 12rem;
            text-align: center;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;

        }

        .buttons:hover {
            cursor: pointer;
            border: 2px solid #4085ed;
            background: #fff;
            color: #4085ed;
            transition: cubic-bezier(0.075, 0.82, 0.165, 1) 2s;
        }

        .div {
            background: #f3c361;
            border: 5px solid black;
            border-radius: 2rem;
            min-height: 250px;
            width: 500px;
            color: deeppink;
            font-size: 24px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div>
        <ul>
        </ul>
    </div>

    <button id="btn-create">Create</button>
    <button id="btn-rm">Remove</button>
    <button id="btn-reset">Reset</button>


    <script src="index.js"></script>
</body>

</html>
