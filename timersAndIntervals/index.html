<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Download Progress Bar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Downloading...</h2>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p class="percentage" id="percentageText">0%</p>

        <button id="startBtn">Start Download</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
